<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>相册维护工具</title>
  <link rel="stylesheet" href="../css/app.css">
  <style>
    #admin { max-width: 900px; margin: 0 auto; padding: 16px 16px 60px; }
    .admin-card { max-width: none; margin: 0 0 14px; box-shadow: none; border: 1px solid var(--line); }
    .admin-card h2 { margin-bottom: 8px; }
    .admin-card .input { margin-bottom: 8px; }
    .admin-head { display: flex; justify-content: space-between; align-items: baseline; margin: 8px 0 14px; }
    .admin-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .admin-table th, .admin-table td { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    .ok-text { color: var(--ok); }
    @media (max-width: 600px) { .admin-table { display: block; overflow-x: auto; } }
  </style>
</head>
<body>
  <div id="admin"></div>
  <script src="../data/region-map-anon.js"></script>
  <script src="../vendor/cos-js-sdk-v5.min.js"></script>
  <script type="module" src="../js/admin.js"></script>
</body>
</html>
