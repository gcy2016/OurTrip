<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>密钥加密工具</title>
  <link rel="stylesheet" href="../css/app.css">
  <style>
    .tool { max-width: 640px; margin: 0 auto; padding: 24px 16px 60px; }
    .tool h1 { margin-bottom: 8px; }
    .tool label { display: block; margin: 12px 0 4px; font-weight: 600; }
    .tool textarea.out { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
    .warn { color: var(--warn); }
  </style>
</head>
<body>
  <div class="tool card" style="max-width:640px;margin:24px auto">
    <h1>密钥加密工具</h1>
    <p class="notice">所有计算都在你自己的浏览器里完成，子账号密钥和共享密码不会发送到任何地方。</p>

    <label for="sid">网页用子账号（子用户 A）的 SecretId</label>
    <input id="sid" class="input" autocomplete="off" spellcheck="false">
    <label for="skey">SecretKey</label>
    <input id="skey" class="input" type="password" autocomplete="off" spellcheck="false">
    <label for="pw1">共享密码（两人共用）</label>
    <input id="pw1" class="input" type="password" autocomplete="new-password">
    <label for="pw2">再输入一次共享密码</label>
    <input id="pw2" class="input" type="password" autocomplete="new-password">
    <p class="dialog-hint">建议 12 位以上、字母和数字混合、不是常用词。密文会放在公开网页里，短密码可能被离线猜出来。</p>
    <p id="msg" class="error-text"></p>
    <button id="go" class="btn btn-primary">生成密文</button>

    <div id="result" hidden>
      <label for="out">密文（可以公开，可以发给 Claude）</label>
      <textarea id="out" class="input out" rows="8" readonly></textarea>
      <div class="row-gap">
        <button id="copy" class="btn">复制密文</button>
        <button id="verify" class="btn">用密码验证一次</button>
      </div>
      <p id="vmsg" class="dialog-hint"></p>
      <p class="dialog-hint">把整段密文填到 <code>js/config.js</code> 的 <code>encryptedCredentials</code>，或发给 Claude 代为填写。<strong>不要</strong>把 SecretId、SecretKey、共享密码发给任何人。</p>
    </div>
  </div>
  <script type="module">
    import { encryptSecret, decryptSecret } from '../js/crypto.js';
    const $ = (id) => document.getElementById(id);
    let blob = null;
    $('go').addEventListener('click', async () => {
      const msg = $('msg');
      msg.textContent = '';
      msg.className = 'error-text';
      const secretId = $('sid').value.trim();
      const secretKey = $('skey').value.trim();
      const pw = $('pw1').value;
      if (!secretId || !secretKey) return (msg.textContent = '请填写 SecretId 和 SecretKey');
      if (!/^AKID/.test(secretId)) msg.textContent = '提示：腾讯云 SecretId 通常以 AKID 开头，请确认没有填反。';
      if (!pw) return (msg.textContent = '请填写共享密码');
      if (pw !== $('pw2').value) return (msg.textContent = '两次输入的共享密码不一致');
      if (pw.length < 12 || !/[a-zA-Z]/.test(pw) || !/\d/.test(pw)) {
        if (!confirm('这个共享密码偏弱（少于 12 位或没有同时包含字母和数字），密文公开后可能被离线猜出。仍然继续？')) return;
      }
      $('go').disabled = true;
      $('go').textContent = '正在加密（约需 1–3 秒）…';
      try {
        blob = await encryptSecret({ secretId, secretKey }, pw);
        $('out').value = JSON.stringify(blob, null, 2);
        $('result').hidden = false;
        $('skey').value = '';
        $('pw1').value = '';
        $('pw2').value = '';
      } catch (e) {
        msg.textContent = '加密失败：' + e.message;
      } finally {
        $('go').disabled = false;
        $('go').textContent = '生成密文';
      }
    });
    $('copy').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText($('out').value);
        $('vmsg').textContent = '已复制';
      } catch {
        $('out').select();
        $('vmsg').textContent = '请手动复制（已全选）';
      }
    });
    $('verify').addEventListener('click', async () => {
      const pw = prompt('输入共享密码验证');
      if (!pw) return;
      try {
        const { secret } = await decryptSecret(JSON.parse($('out').value), pw);
        $('vmsg').textContent = `验证通过（SecretId ${secret.secretId.slice(0, 6)}…）`;
      } catch (e) {
        $('vmsg').textContent = e.code === 'WRONG_PASSWORD' ? '密码不正确' : '密文格式错误';
      }
    });
  </script>
</body>
</html>
